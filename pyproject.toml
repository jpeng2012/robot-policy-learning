[project]
name = "robot-policy-learning"
version = "0.1.0"
description = "Robot policy learning with constrained environments"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "robosuite",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["scripts*", "data*"]
